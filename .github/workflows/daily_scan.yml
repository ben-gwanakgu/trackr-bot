name: Daily Trackr Scanner

on:
  schedule:
    - cron: '0 8 * * *'  # Runs automatically every day at 08:00 UTC
  workflow_dispatch:     # Allows you to press a button to run it manually anytime

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Restore Previous Snapshot
      uses: actions/cache@v4
      with:
        path: previous_snapshot.txt
        key: snapshot-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          snapshot-${{ runner.os }}-

    - name: Run Scraper
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scraper.py
